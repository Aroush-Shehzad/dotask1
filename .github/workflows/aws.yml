
name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect and Check Docker
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to EC2"

            echo "Checking Docker..."
            sudo docker --version

            echo "Listing all containers..."
            sudo docker ps -a

            echo "Checking Docker image..."
            sudo docker images aroush44/dotask

            echo "Checking application logs..."
            sudo docker logs --tail 30 gifted_raman

            echo "Docker inspection completed!"
