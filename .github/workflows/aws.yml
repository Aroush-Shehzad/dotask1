
name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect and Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          debug: true
          script_stop: true
          script: |
            echo "Successfully connected to EC2"

            echo "Checking Docker installation..."
            sudo docker --version

            echo "Checking Docker service..."
            sudo systemctl status docker --no-pager

            echo "Listing existing containers..."
            sudo docker ps -a

            echo "Checking student-portal container..."

            if sudo docker container inspect student-portal >/dev/null 2>&1
            then
              echo "Container found!"

              sudo docker restart student-portal

              echo "Checking deployment status..."
              sudo docker ps --filter name=student-portal

              echo "Deployment completed!"
            else
              echo "ERROR: student-portal container not found!"
              echo "Check the container name using docker ps -a"
              exit 1
            fi
